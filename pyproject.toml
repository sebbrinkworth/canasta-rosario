[project]
name = "canasta-rosario"
version = "0.2.0"
description = "Canasta Rosario - ETL SEPA"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
evaluation = ["scikit-learn>=1.4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
